version: 1
adapters:
  work_items: github      # Work items are GitHub issues.
  workspace: git-worktree # Work happens in git worktrees.
  conductor: opus         # Transparency only: the human session that conducts.
  worker: codex           # Codex implements each issue.
  vcs: github             # GitHub hosts PRs and checks.
  verifier: claude        # SHOULD differ from worker; provider registry key.
  gate: human-merge       # loopcoder itself stays human-gated; consumer projects can pass init --gate auto to opt in.
worker:
  # Optional. Absent = inherit your codex global config (~/.codex/config.toml). loopcoder never sets these on its own; they appear only when you state a permanent preference.
  # model:
  # Optional. Absent = inherit your codex global config (~/.codex/config.toml). loopcoder never sets these on its own; they appear only when you state a permanent preference.
  # reasoning_effort:
  base_branch: main
  command_hint: "implement the issue, run relevant checks, commit"
environment:
  pre_prod_branch: pre-prod # Tick auto-merges clean PRs here only; main remains human-only.
verifier:
  model: "claude-opus-4-8[1m]"
  reasoning_effort: max
# resilience:
#   worker:
#     Optional. Absent = 15; expected worker heartbeat cadence in seconds.
#     heartbeat_interval_seconds: 15
#     Optional. Absent = 120; mark progress stale after this many seconds without phase or log growth.
#     stale_after_seconds: 120
#     Optional. Absent = 300; classify hung after stale progress or stale sidecar with no live process.
#     hung_after_seconds: 300
#     Optional. Absent = 3; maximum attempts before blocking for a human decision.
#     max_attempts: 3
#     Optional. Absent = [10, 30, 120]; retry backoff schedule between attempts.
#     retry_backoff_seconds: [10, 30, 120]
#     Optional. Absent = 2700; process-watchdog hard cap (seconds) for the worker provider CLI; it is killed past this.
#     hard_cap_seconds: 2700
#     Optional. Absent = 300; kill the worker provider CLI after this many seconds with no log output or worktree file activity (stall).
#     stall_timeout_seconds: 300
#   verifier:
#     Optional. Absent = 900; process-watchdog hard cap (seconds) for the verifier provider CLI.
#     hard_cap_seconds: 900
#     Optional. Absent = 300; kill the verifier provider CLI after this many seconds with no log output or worktree file activity (stall).
#     stall_timeout_seconds: 300
ci:
  checks: [verify, go, staticcheck, govulncheck, audit]
  # Optional. Absent = no local test command gate.
  # tests:
  #   - bun run test
  # Optional. Absent = no local typecheck command gate.
  # typecheck:
  #   - bunx tsc --noEmit -p tsconfig.json
  # Optional. Absent = no local build command gate.
  # build:
  #   - bun run build
# verification:
#   Optional. Absent = true for loopcoder code PRs.
#   spec_required: true
#   Optional. Absent = 3.
#   max_fix_passes: 3
#   browser:
#     Optional. auto|always|never; absent = auto.
#     enabled: auto
#     Optional. Changed-path patterns that trigger browser verification in auto mode.
#     globs:
#       - web/**
#       - app/**
#       - "**/*.css"
#       - "**/*.tsx"
report:
  channel: chat
audit:
  severity_threshold: medium
  sast:
    commands:
      - id: govulncheck
        argv: ["govulncheck", "-json", "./..."]
        parser: govulncheck-json
        timeout_seconds: 300
      - id: staticcheck
        argv: ["staticcheck", "-f", "json", "./..."]
        parser: staticcheck-json
        timeout_seconds: 300
      # loopcoder is an operator-trusted orchestration CLI. Its self-audit
      # intentionally runs provider/git/gh subprocesses, reads operator-selected
      # repo paths, stages state snapshots, and uses SHA-1 only for stable
      # non-cryptographic IDs. Native audit scans remain enabled for sensitive
      # file-mode and secret classes, so these gosec rule exclusions keep CI
      # focused on non-inherent findings instead of per-platform line waivers.
      - id: gosec
        argv: ["gosec", "-fmt", "json", "-quiet", "-exclude=G101,G104,G122,G204,G301,G302,G304,G306,G401,G505,G703", "./..."]
        parser: gosec-json
        timeout_seconds: 300
    native:
      secrets: true
      file_permissions: true
      include:
        - "**/*"
      exclude:
        - ".git/**"
        - ".loopcoder/**"
        - "docs/specs/**"
        - "**/*_test.go"
        - "vendor/**"
        - "dist/**"
        - "node_modules/**"
  review:
    rubric_path: docs/security/audit-rubric.md
  baseline:
    path: docs/security/audit-baseline.yml
