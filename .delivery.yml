version: 1
adapters:
  work_items: github      # Work items are GitHub issues.
  workspace: git-worktree # Work happens in git worktrees.
  conductor: opus         # Transparency only: the human session that conducts.
  worker: codex           # Codex implements each issue.
  vcs: github             # GitHub hosts PRs and checks.
  verifier: opus          # SHOULD differ from worker; conductor self-reviews until loopreview lands.
  gate: human-merge       # Humans choose what merges.
worker:
  # Optional. Absent = inherit your codex global config (~/.codex/config.toml). loopcoder never sets these on its own; they appear only when you state a permanent preference.
  # model:
  # Optional. Absent = inherit your codex global config (~/.codex/config.toml). loopcoder never sets these on its own; they appear only when you state a permanent preference.
  # reasoning_effort:
  base_branch: main
  command_hint: "implement the issue, run relevant checks, commit"
# resilience:
#   worker:
#     Optional. Absent = 15; expected worker heartbeat cadence in seconds.
#     heartbeat_interval_seconds: 15
#     Optional. Absent = 120; mark progress stale after this many seconds without phase or log growth.
#     stale_after_seconds: 120
#     Optional. Absent = 300; classify hung after stale progress or stale sidecar with no live process.
#     hung_after_seconds: 300
#     Optional. Absent = 3; maximum attempts before blocking for a human decision.
#     max_attempts: 3
#     Optional. Absent = [10, 30, 120]; retry backoff schedule between attempts.
#     retry_backoff_seconds: [10, 30, 120]
ci:
  checks: [verify, go]
  # Optional. Absent = no local test command gate.
  # tests:
  #   - bun run test
  # Optional. Absent = no local typecheck command gate.
  # typecheck:
  #   - bunx tsc --noEmit -p tsconfig.json
  # Optional. Absent = no local build command gate.
  # build:
  #   - bun run build
# verification:
#   Optional. Absent = true for loopcoder code PRs.
#   spec_required: true
#   Optional. Absent = 3.
#   max_fix_passes: 3
#   browser:
#     Optional. auto|always|never; absent = auto.
#     enabled: auto
#     Optional. Changed-path patterns that trigger browser verification in auto mode.
#     globs:
#       - web/**
#       - app/**
#       - "**/*.css"
#       - "**/*.tsx"
report:
  channel: chat
