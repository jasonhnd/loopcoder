name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GO_VERSION: '1.26.5'

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            format: zip
          - goos: windows
            goarch: arm64
            format: zip
          - goos: darwin
            goarch: amd64
            format: tar.gz
          - goos: darwin
            goarch: arm64
            format: tar.gz
          - goos: linux
            goarch: amd64
            format: tar.gz
          - goos: linux
            goarch: arm64
            format: tar.gz
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          FORMAT: ${{ matrix.format }}
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          build_date="$(git show -s --format=%cI "${COMMIT_SHA}")"
          archive="loopcoder_${version}_${GOOS}_${GOARCH}.${FORMAT}"
          binary="loopcoder"
          if [[ "${GOOS}" == "windows" ]]; then
            binary="loopcoder.exe"
          fi

          rm -rf dist
          mkdir -p dist/package

          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${COMMIT_SHA} -X main.date=${build_date}" \
            -o "dist/package/${binary}" \
            ./cmd/loopcoder

          if [[ "${GOOS}" == "linux" && "${GOARCH}" == "amd64" ]]; then
            version_output="$("./dist/package/${binary}" --version)"
            echo "${version_output}"
            if [[ "${version_output}" == *"version=dev"* ]]; then
              echo "release binary still reports version=dev" >&2
              exit 1
            fi
            if [[ "${version_output}" == *"commit=unknown"* || "${version_output}" == *"date=unknown"* ]]; then
              echo "release binary still reports unknown commit/date" >&2
              exit 1
            fi
          fi

          cp LICENSE dist/package/LICENSE

          if [[ "${FORMAT}" == "zip" ]]; then
            (cd dist/package && zip -q -r "../${archive}" "${binary}" LICENSE)
          else
            tar -C dist/package -czf "dist/${archive}" "${binary}" LICENSE
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/loopcoder_*
          if-no-files-found: error

  sign:
    name: sign candidate checksums
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail

          cd dist
          sha256sum loopcoder_* | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify checksums
        run: |
          set -euo pipefail

          cd dist
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          issuer="https://token.actions.githubusercontent.com"

          cosign sign-blob SHA256SUMS --bundle SHA256SUMS.sigstore --yes
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.sigstore \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}"

          printf 'Signed SHA256SUMS with Sigstore issuer %s and identity %s\n' "${issuer}" "${identity}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ github.ref_name }}
          path: |
            dist/loopcoder_*
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore
          if-no-files-found: error

  draft:
    name: create draft release
    runs-on: ubuntu-latest
    needs: sign
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-${{ github.ref_name }}
          path: dist

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          assets=(dist/loopcoder_* dist/SHA256SUMS dist/SHA256SUMS.sigstore)
          notes_file=".github/release-notes/${TAG_NAME}.md"
          if [[ -f "${notes_file}" ]]; then
            cp "${notes_file}" release-notes.md
          else
            identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG_NAME}"
            issuer="https://token.actions.githubusercontent.com"
            printf 'Automated release for %s. SHA256SUMS is signed with cosign keyless identity %s and OIDC issuer %s.\n' "${TAG_NAME}" "${identity}" "${issuer}" > release-notes.md
          fi

          release_json="$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" 2>/dev/null || true)"
          if [[ -n "${release_json}" ]]; then
            draft="$(jq -r '.draft' <<<"${release_json}")"
            if [[ "${draft}" != "true" ]]; then
              echo "release ${TAG_NAME} already exists and is public; refusing to overwrite final release" >&2
              exit 1
            fi
            gh release edit "${TAG_NAME}" --repo "${GH_REPO}" --prerelease --notes-file release-notes.md
            gh release upload "${TAG_NAME}" --repo "${GH_REPO}" "${assets[@]}" --clobber
          else
            gh release create "${TAG_NAME}" "${assets[@]}" \
              --repo "${GH_REPO}" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "${TAG_NAME}" \
              --notes-file release-notes.md
          fi

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: draft
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Smoke staged draft artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release-smoke.ps1 -Version '${{ github.ref_name }}' -PreviousVersion '0.6.1'

  publish:
    name: publish final release
    runs-on: ubuntu-latest
    needs: smoke
    environment: release-publication
    permissions:
      contents: write
    steps:
      - name: Promote tested draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_id="$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" --jq '.id')"
          gh api "repos/${GH_REPO}/releases/${release_id}" \
            --method PATCH \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true >/dev/null
          gh release view "${TAG_NAME}" --repo "${GH_REPO}"

  failed-draft:
    name: mark failed draft
    runs-on: ubuntu-latest
    needs:
      - draft
      - smoke
    if: ${{ failure() && needs.draft.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Keep failed candidate as draft evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}")"
          release_id="$(jq -r '.id' <<<"${release_json}")"
          body="$(jq -r '.body // ""' <<<"${release_json}")"
          {
            printf '%s\n\n' "${body}"
            printf 'Pre-publication smoke failed for workflow run: %s\n' "${RUN_URL}"
            printf 'The release remains a draft so candidate assets and diagnostics are preserved.\n'
          } > failed-draft-notes.md
          gh api "repos/${GH_REPO}/releases/${release_id}" \
            --method PATCH \
            -F draft=true \
            -F prerelease=true \
            -f body="$(cat failed-draft-notes.md)" >/dev/null
