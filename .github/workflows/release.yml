name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            format: zip
          - goos: windows
            goarch: arm64
            format: zip
          - goos: darwin
            goarch: amd64
            format: tar.gz
          - goos: darwin
            goarch: arm64
            format: tar.gz
          - goos: linux
            goarch: amd64
            format: tar.gz
          - goos: linux
            goarch: arm64
            format: tar.gz
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          FORMAT: ${{ matrix.format }}
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          archive="loopcoder_${version}_${GOOS}_${GOARCH}.${FORMAT}"
          binary="loopcoder"
          if [[ "${GOOS}" == "windows" ]]; then
            binary="loopcoder.exe"
          fi

          rm -rf dist
          mkdir -p dist/package

          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${COMMIT_SHA} -X main.date=${build_date}" \
            -o "dist/package/${binary}" \
            ./cmd/loopcoder

          if [[ "${GOOS}" == "linux" && "${GOARCH}" == "amd64" ]]; then
            version_output="$("./dist/package/${binary}" --version)"
            echo "${version_output}"
            if [[ "${version_output}" == *"version=dev"* ]]; then
              echo "release binary still reports version=dev" >&2
              exit 1
            fi
            if [[ "${version_output}" == *"commit=unknown"* || "${version_output}" == *"date=unknown"* ]]; then
              echo "release binary still reports unknown commit/date" >&2
              exit 1
            fi
          fi

          cp LICENSE dist/package/LICENSE

          if [[ "${FORMAT}" == "zip" ]]; then
            (cd dist/package && zip -q -r "../${archive}" "${binary}" LICENSE)
          else
            tar -C dist/package -czf "dist/${archive}" "${binary}" LICENSE
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/loopcoder_*
          if-no-files-found: error

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail

          cd dist
          sha256sum loopcoder_* > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Sign and verify checksums
        run: |
          set -euo pipefail

          cd dist
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          issuer="https://token.actions.githubusercontent.com"

          cosign sign-blob SHA256SUMS --bundle SHA256SUMS.sigstore --yes
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.sigstore \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}"

          printf 'Signed SHA256SUMS with Sigstore issuer %s and identity %s\n' "${issuer}" "${identity}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          assets=(dist/loopcoder_* dist/SHA256SUMS dist/SHA256SUMS.sigstore)
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG_NAME}"
          issuer="https://token.actions.githubusercontent.com"
          notes="Automated release for ${TAG_NAME}. SHA256SUMS is signed with cosign keyless identity ${identity} and OIDC issuer ${issuer}."

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --notes "${notes}"
            gh release upload "${TAG_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${TAG_NAME}" "${assets[@]}" \
              --verify-tag \
              --title "${TAG_NAME}" \
              --notes "${notes}"
          fi
