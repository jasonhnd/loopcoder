name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GO_VERSION: '1.26.5'

jobs:
  build:
    name: build (darwin/arm64)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Assert darwin/arm64 Go host
        run: |
          set -euo pipefail
          actual_goos="$(go env GOOS)"
          actual_goarch="$(go env GOARCH)"
          printf 'Go host tuple: %s/%s\n' "${actual_goos}" "${actual_goarch}"
          test "${actual_goos}" = "darwin"
          test "${actual_goarch}" = "arm64"

      - name: Build archive
        env:
          GOOS: darwin
          GOARCH: arm64
          FORMAT: tar.gz
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          test "$(go env GOOS)" = "darwin"
          test "$(go env GOARCH)" = "arm64"
          test "${GOOS}" = "darwin"
          test "${GOARCH}" = "arm64"
          test "${FORMAT}" = "tar.gz"

          version="${TAG_NAME#v}"
          build_date="$(git show -s --format=%cI "${COMMIT_SHA}")"
          archive="loopcoder_${version}_darwin_arm64.tar.gz"
          binary="loopcoder"

          rm -rf dist
          mkdir -p dist/package

          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${COMMIT_SHA} -X main.date=${build_date}" \
            -o "dist/package/${binary}" \
            ./cmd/loopcoder

          version_output="$("./dist/package/${binary}" --version)"
          echo "${version_output}"
          if [[ "${version_output}" == *"version=dev"* ]]; then
            echo "release binary still reports version=dev" >&2
            exit 1
          fi
          if [[ "${version_output}" == *"commit=unknown"* || "${version_output}" == *"date=unknown"* ]]; then
            echo "release binary still reports unknown commit/date" >&2
            exit 1
          fi

          cp LICENSE dist/package/LICENSE

          tar -C dist/package -czf "dist/${archive}" "${binary}" LICENSE
          bash scripts/stage-draft-release.sh validate-archives

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-darwin-arm64
          path: dist/loopcoder_*_darwin_arm64.tar.gz
          if-no-files-found: error

  sign:
    name: sign candidate checksums
    runs-on: macos-15
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Assert darwin/arm64 Go host
        run: |
          set -euo pipefail
          actual_goos="$(go env GOOS)"
          actual_goarch="$(go env GOARCH)"
          printf 'Go host tuple: %s/%s\n' "${actual_goos}" "${actual_goarch}"
          test "${actual_goos}" = "darwin"
          test "${actual_goarch}" = "arm64"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-darwin-arm64
          path: dist

      - name: Generate checksums
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          bash scripts/stage-draft-release.sh validate-archives

          cd dist
          version="${TAG_NAME#v}"
          archive="loopcoder_${version}_darwin_arm64.tar.gz"
          shasum -a 256 "${archive}" | awk '{print $1 "  " $2}' | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify checksums
        run: |
          set -euo pipefail

          cd dist
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          issuer="https://token.actions.githubusercontent.com"

          cosign sign-blob SHA256SUMS --bundle SHA256SUMS.sigstore --yes
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.sigstore \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}"

          printf 'Signed SHA256SUMS with Sigstore issuer %s and identity %s\n' "${issuer}" "${identity}"
          cd ..
          bash scripts/stage-draft-release.sh validate-candidate

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ github.ref_name }}
          path: |
            dist/loopcoder_*
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore
          if-no-files-found: error

  draft:
    name: create draft release
    runs-on: macos-15
    needs: sign
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Assert darwin/arm64 Go host
        run: |
          set -euo pipefail
          actual_goos="$(go env GOOS)"
          actual_goarch="$(go env GOARCH)"
          printf 'Go host tuple: %s/%s\n' "${actual_goos}" "${actual_goarch}"
          test "${actual_goos}" = "darwin"
          test "${actual_goarch}" = "arm64"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-${{ github.ref_name }}
          path: dist

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          bash scripts/stage-draft-release.sh validate-candidate
          bash scripts/stage-draft-release.sh

  smoke:
    name: smoke (darwin/arm64)
    runs-on: macos-15
    needs: draft
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Assert darwin/arm64 Go host
        run: |
          set -euo pipefail
          actual_goos="$(go env GOOS)"
          actual_goarch="$(go env GOARCH)"
          printf 'Go host tuple: %s/%s\n' "${actual_goos}" "${actual_goarch}"
          test "${actual_goos}" = "darwin"
          test "${actual_goarch}" = "arm64"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Smoke staged draft artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release-smoke.ps1 -Version '${{ github.ref_name }}' -PreviousVersion '0.7.0'

  publish:
    name: publish final release
    runs-on: macos-15
    needs: smoke
    environment: release-publication
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Assert darwin/arm64 Go host
        run: |
          set -euo pipefail
          actual_goos="$(go env GOOS)"
          actual_goarch="$(go env GOARCH)"
          printf 'Go host tuple: %s/%s\n' "${actual_goos}" "${actual_goarch}"
          test "${actual_goos}" = "darwin"
          test "${actual_goarch}" = "arm64"

      - name: Promote tested draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_json="$(bash scripts/stage-draft-release.sh resolve-json)"
          release_id="$(jq -r '.id' <<<"${release_json}")"
          gh api "repos/${GH_REPO}/releases/${release_id}" \
            --method PATCH \
            -f tag_name="${TAG_NAME}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true >/dev/null
          gh release view "${TAG_NAME}" --repo "${GH_REPO}"

  failed-draft:
    name: mark failed draft
    runs-on: macos-15
    needs:
      - draft
      - smoke
    if: ${{ failure() && needs.draft.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Assert darwin/arm64 Go host
        run: |
          set -euo pipefail
          actual_goos="$(go env GOOS)"
          actual_goarch="$(go env GOARCH)"
          printf 'Go host tuple: %s/%s\n' "${actual_goos}" "${actual_goarch}"
          test "${actual_goos}" = "darwin"
          test "${actual_goarch}" = "arm64"

      - name: Keep failed candidate as draft evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          release_json="$(bash scripts/stage-draft-release.sh resolve-json)"
          release_id="$(jq -r '.id' <<<"${release_json}")"
          body="$(jq -r '.body // ""' <<<"${release_json}")"
          {
            printf '%s\n\n' "${body}"
            printf 'Pre-publication smoke failed for workflow run: %s\n' "${RUN_URL}"
            printf 'The release remains a draft so candidate assets and diagnostics are preserved.\n'
          } > failed-draft-notes.md
          gh api "repos/${GH_REPO}/releases/${release_id}" \
            --method PATCH \
            -f tag_name="${TAG_NAME}" \
            -F draft=true \
            -F prerelease=true \
            -f body="$(cat failed-draft-notes.md)" >/dev/null
