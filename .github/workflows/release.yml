name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            format: zip
          - goos: windows
            goarch: arm64
            format: zip
          - goos: darwin
            goarch: amd64
            format: tar.gz
          - goos: darwin
            goarch: arm64
            format: tar.gz
          - goos: linux
            goarch: amd64
            format: tar.gz
          - goos: linux
            goarch: arm64
            format: tar.gz
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          FORMAT: ${{ matrix.format }}
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          archive="loopcoder_${version}_${GOOS}_${GOARCH}.${FORMAT}"
          binary="loopcoder"
          if [[ "${GOOS}" == "windows" ]]; then
            binary="loopcoder.exe"
          fi

          rm -rf dist
          mkdir -p dist/package

          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${COMMIT_SHA} -X main.date=${build_date}" \
            -o "dist/package/${binary}" \
            ./cmd/loopcoder

          if [[ "${GOOS}" == "linux" && "${GOARCH}" == "amd64" ]]; then
            version_output="$("./dist/package/${binary}" --version)"
            echo "${version_output}"
            if [[ "${version_output}" == *"version=dev"* ]]; then
              echo "release binary still reports version=dev" >&2
              exit 1
            fi
            if [[ "${version_output}" == *"commit=unknown"* || "${version_output}" == *"date=unknown"* ]]; then
              echo "release binary still reports unknown commit/date" >&2
              exit 1
            fi
          fi

          cp LICENSE dist/package/LICENSE

          if [[ "${FORMAT}" == "zip" ]]; then
            (cd dist/package && zip -q -r "../${archive}" "${binary}" LICENSE)
          else
            tar -C dist/package -czf "dist/${archive}" "${binary}" LICENSE
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/loopcoder_*
          if-no-files-found: error

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail

          cd dist
          sha256sum loopcoder_* > SHA256SUMS
          cat SHA256SUMS

      - name: Signing TODO
        run: |
          echo "TODO: Add cosign or minisign signing for SHA256SUMS in a follow-up release slice."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          assets=(dist/loopcoder_* dist/SHA256SUMS)

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${TAG_NAME}" "${assets[@]}" \
              --verify-tag \
              --title "${TAG_NAME}" \
              --notes "Automated release for ${TAG_NAME}."
          fi
