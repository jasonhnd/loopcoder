name: CI

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: YAML validity check
        run: |
          set -euo pipefail

          mapfile -t yaml_files < <(
            {
              printf '%s\n' '.delivery.yml'
              find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print
            } | sort
          )

          if command -v yq >/dev/null 2>&1; then
            for file in "${yaml_files[@]}"; do
              yq '.' "$file" >/dev/null
            done
            exit 0
          fi

          python3 - "${yaml_files[@]}" <<'PY'
          import sys

          import yaml

          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as yaml_file:
                  yaml.safe_load(yaml_file)
          PY

      - name: CI check mapping check
        run: |
          set -euo pipefail

          if command -v yq >/dev/null 2>&1; then
            mapfile -t required_checks < <(yq -r '(.ci.checks // []) | .[]' '.delivery.yml')
            mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort)
            job_ids_file="$(mktemp)"
            trap 'rm -f "$job_ids_file"' EXIT

            for file in "${workflow_files[@]}"; do
              yq -r '(.jobs // {}) | keys | .[]' "$file" >>"$job_ids_file"
            done

            missing=()
            for check in "${required_checks[@]}"; do
              if ! grep -Fxq "$check" "$job_ids_file"; then
                missing+=("$check")
              fi
            done

            if ((${#missing[@]} > 0)); then
              echo "The following ci.checks entries do not match any workflow job id:"
              printf '  - %s\n' "${missing[@]}"
              exit 1
            fi

            exit 0
          fi

          python3 - <<'PY'
          import glob
          import sys

          import yaml

          with open(".delivery.yml", encoding="utf-8") as delivery_file:
              delivery = yaml.safe_load(delivery_file) or {}

          required_checks = [
              str(check) for check in (delivery.get("ci") or {}).get("checks") or []
          ]
          job_ids = set()

          workflow_paths = sorted(
              glob.glob(".github/workflows/*.yml")
              + glob.glob(".github/workflows/*.yaml")
          )
          for workflow_path in workflow_paths:
              with open(workflow_path, encoding="utf-8") as workflow_file:
                  workflow = yaml.safe_load(workflow_file) or {}
              job_ids.update(str(job_id) for job_id in (workflow.get("jobs") or {}).keys())

          missing = [check for check in required_checks if check not in job_ids]
          if missing:
              print("The following ci.checks entries do not match any workflow job id:")
              for check in missing:
                  print(f"  - {check}")
              sys.exit(1)
          PY

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Go build
        run: go build ./cmd/loopcoder

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...
