name: CI

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

env:
  GO_VERSION: '1.26.5'
  STATICCHECK_VERSION: 'v0.7.0'
  GOVULNCHECK_VERSION: 'v1.6.0'
  GOSEC_VERSION: 'v2.27.1'

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Assert darwin/arm64 Go host
        run: |
          set -euo pipefail
          actual_goos="$(go env GOOS)"
          actual_goarch="$(go env GOARCH)"
          printf 'Go host tuple: %s/%s\n' "${actual_goos}" "${actual_goarch}"
          test "${actual_goos}" = "darwin"
          test "${actual_goarch}" = "arm64"

      - name: Record tested commit SHA
        run: |
          set -euo pipefail
          printf 'evidence_tier=pull-request\n'
          printf 'tested_commit_sha=%s\n' "${GITHUB_SHA}"

      - name: YAML validity check
        run: |
          set -euo pipefail

          ruby -e '
            require "yaml"

            paths = [".delivery.yml"] + Dir.glob([".github/workflows/**/*.yml", ".github/workflows/**/*.yaml"]).select { |path| File.file?(path) }
            paths.sort.each { |path| YAML.load_file(path) }
          '

      - name: Implementation authorization (status:planned rejection)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Always run offline fixtures; additionally evaluate the PR when event is pull_request.
          IMPLEMENTATION_AUTH_OFFLINE=1 bash scripts/check-implementation-authorization.sh
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}" \
              REPO="${{ github.repository }}" \
              bash scripts/check-implementation-authorization.sh
          fi

      - name: assert-pre-prod-green offline provenance fixtures
        run: |
          set -euo pipefail
          bash scripts/assert-pre-prod-green_test.sh

      - name: CI check mapping check
        run: go test . -run 'TestV080WorkflowPolicy|TestStabilizationGatePolicy' -count=1

      - name: Repository workflow policy
        run: go test . -run 'TestV080WorkflowPolicy|TestStabilizationGatePolicy' -count=1

      - name: Release draft staging unit test
        run: bash scripts/stage-draft-release_test.sh

      - name: Installer unit test
        run: bash scripts/install_test.sh

      - name: Release provider canary harness unit test
        run: bash scripts/release-provider-canary_test.sh

      - name: macOS codesign harness unit test
        run: bash scripts/macos-codesign-notarize_test.sh

      - name: v0.8.1 product-path go/no-go gate unit test
        run: bash scripts/v081-product-path-gate_test.sh

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Assert darwin/arm64 Go host
        run: |
          set -euo pipefail
          actual_goos="$(go env GOOS)"
          actual_goarch="$(go env GOARCH)"
          printf 'Go host tuple: %s/%s\n' "${actual_goos}" "${actual_goarch}"
          test "${actual_goos}" = "darwin"
          test "${actual_goarch}" = "arm64"

      - name: Record tested commit SHA
        run: |
          set -euo pipefail
          printf 'evidence_tier=pull-request\n'
          printf 'tested_commit_sha=%s\n' "${GITHUB_SHA}"

      - name: Go build
        run: go build ./cmd/loopcoder

      - name: Go vet
        run: go vet ./...

      - name: Markdown internal links
        run: go test . -run TestMarkdownInternalLinks -count=1

      - name: Go test
        run: go test ./...

  race:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Assert darwin/arm64 Go host
        run: |
          set -euo pipefail
          actual_goos="$(go env GOOS)"
          actual_goarch="$(go env GOARCH)"
          printf 'Go host tuple: %s/%s\n' "${actual_goos}" "${actual_goarch}"
          test "${actual_goos}" = "darwin"
          test "${actual_goarch}" = "arm64"

      - name: Record tested commit SHA
        run: |
          set -euo pipefail
          printf 'evidence_tier=pull-request\n'
          printf 'tested_commit_sha=%s\n' "${GITHUB_SHA}"

      - name: Go test changed packages (race detector)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: bash scripts/ci-race-changed.sh "${PR_BASE_SHA:-${PUSH_BASE_SHA:-}}"

  security:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Assert darwin/arm64 Go host
        run: |
          set -euo pipefail
          actual_goos="$(go env GOOS)"
          actual_goarch="$(go env GOARCH)"
          printf 'Go host tuple: %s/%s\n' "${actual_goos}" "${actual_goarch}"
          test "${actual_goos}" = "darwin"
          test "${actual_goarch}" = "arm64"

      - name: Record tested commit SHA
        run: |
          set -euo pipefail
          printf 'evidence_tier=pull-request\n'
          printf 'tested_commit_sha=%s\n' "${GITHUB_SHA}"

      - name: Install audit tools
        run: |
          set -euo pipefail
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "govulncheck ${GOVULNCHECK_VERSION}"
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          echo "staticcheck ${STATICCHECK_VERSION}"
          go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
          echo "gosec ${GOSEC_VERSION}"
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}

      - name: Staticcheck
        run: staticcheck ./...

      - name: Govulncheck
        run: govulncheck ./...

      - name: Build loopcoder
        run: go build -o ./bin/loopcoder ./cmd/loopcoder

      - name: Audit
        run: ./bin/loopcoder audit --repo . --layer sast
