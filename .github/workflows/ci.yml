name: CI

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

env:
  GO_VERSION: '1.26.5'
  STATICCHECK_VERSION: 'v0.7.0'
  GOVULNCHECK_VERSION: 'v1.6.0'
  GOSEC_VERSION: 'v2.27.1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: YAML validity check
        run: |
          set -euo pipefail

          mapfile -t yaml_files < <(
            {
              printf '%s\n' '.delivery.yml'
              find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print
            } | sort
          )

          if command -v yq >/dev/null 2>&1; then
            for file in "${yaml_files[@]}"; do
              yq '.' "$file" >/dev/null
            done
            exit 0
          fi

          python3 - "${yaml_files[@]}" <<'PY'
          import sys

          import yaml

          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as yaml_file:
                  yaml.safe_load(yaml_file)
          PY

      - name: CI check mapping check
        run: |
          set -euo pipefail

          if command -v yq >/dev/null 2>&1; then
            mapfile -t required_checks < <(yq -r '(.ci.checks // []) | .[]' '.delivery.yml')
            mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort)
            job_ids_file="$(mktemp)"
            trap 'rm -f "$job_ids_file"' EXIT

            for file in "${workflow_files[@]}"; do
              yq -r '(.jobs // {}) | keys | .[]' "$file" >>"$job_ids_file"
            done

            missing=()
            for check in "${required_checks[@]}"; do
              if ! grep -Fxq "$check" "$job_ids_file"; then
                missing+=("$check")
              fi
            done

            if ((${#missing[@]} > 0)); then
              echo "The following ci.checks entries do not match any workflow job id:"
              printf '  - %s\n' "${missing[@]}"
              exit 1
            fi

            exit 0
          fi

          python3 - <<'PY'
          import glob
          import sys

          import yaml

          with open(".delivery.yml", encoding="utf-8") as delivery_file:
              delivery = yaml.safe_load(delivery_file) or {}

          required_checks = [
              str(check) for check in (delivery.get("ci") or {}).get("checks") or []
          ]
          job_ids = set()

          workflow_paths = sorted(
              glob.glob(".github/workflows/*.yml")
              + glob.glob(".github/workflows/*.yaml")
          )
          for workflow_path in workflow_paths:
              with open(workflow_path, encoding="utf-8") as workflow_file:
                  workflow = yaml.safe_load(workflow_file) or {}
              job_ids.update(str(job_id) for job_id in (workflow.get("jobs") or {}).keys())

          missing = [check for check in required_checks if check not in job_ids]
          if missing:
              print("The following ci.checks entries do not match any workflow job id:")
              for check in missing:
                  print(f"  - {check}")
              sys.exit(1)
          PY

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Go build
        run: go build ./cmd/loopcoder

      - name: Go vet
        run: go vet ./...

      - name: Markdown internal links
        run: go test . -run TestMarkdownInternalLinks -count=1

      - name: Go test
        run: go test ./...

      - name: Go test (race detector)
        run: go test -race ./...

  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Native Go environment
        run: |
          go version
          go env GOVERSION GOOS GOARCH

      - name: Native Go test
        run: go test ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Staticcheck
        run: |
          echo "staticcheck ${STATICCHECK_VERSION}"
          go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Govulncheck
        run: |
          echo "govulncheck ${GOVULNCHECK_VERSION}"
          go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Install audit tools
        run: |
          set -euo pipefail
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "govulncheck ${GOVULNCHECK_VERSION}"
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          echo "staticcheck ${STATICCHECK_VERSION}"
          go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
          echo "gosec ${GOSEC_VERSION}"
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}

      - name: Build loopcoder
        run: go build -o ./bin/loopcoder ./cmd/loopcoder

      - name: Audit
        run: ./bin/loopcoder audit --repo . --layer sast
