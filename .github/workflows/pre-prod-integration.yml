# Re-run required checks on the exact integrated pre-prod SHA (merge-sha tier).
# Next v0.9.0 feature work must wait for this SHA to be green.
name: pre-prod-integration

on:
  push:
    branches:
      - pre-prod
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional git ref to evaluate (defaults to current pre-prod tip)"
        required: false
        type: string

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.26.5"
  STATICCHECK_VERSION: "v0.7.0"
  GOVULNCHECK_VERSION: "v1.6.0"
  GOSEC_VERSION: "v2.27.1"

jobs:
  verify:
    name: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Assert darwin/arm64 Go host
        run: |
          set -euo pipefail
          test "$(go env GOOS)" = "darwin"
          test "$(go env GOARCH)" = "arm64"

      - name: Record tested commit SHA
        run: |
          set -euo pipefail
          printf 'evidence_tier=merge-sha\n'
          printf 'tested_commit_sha=%s\n' "$(git rev-parse HEAD)"
          printf 'integration_branch=pre-prod\n'

      - name: YAML validity check
        run: |
          set -euo pipefail
          ruby -e '
            require "yaml"
            paths = [".delivery.yml"] + Dir.glob([".github/workflows/**/*.yml", ".github/workflows/**/*.yaml"]).select { |path| File.file?(path) }
            paths.sort.each { |path| YAML.load_file(path) }
          '

      - name: Repository workflow policy
        run: go test . -run 'TestV080WorkflowPolicy|TestStabilizationGatePolicy' -count=1

      - name: Implementation authorization offline fixtures
        run: IMPLEMENTATION_AUTH_OFFLINE=1 bash scripts/check-implementation-authorization.sh

  test:
    name: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Record tested commit SHA
        run: |
          set -euo pipefail
          printf 'evidence_tier=merge-sha\n'
          printf 'tested_commit_sha=%s\n' "$(git rev-parse HEAD)"

      - name: Go build
        run: go build ./cmd/loopcoder

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

  race:
    name: race
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Record tested commit SHA
        run: |
          set -euo pipefail
          printf 'evidence_tier=merge-sha\n'
          printf 'tested_commit_sha=%s\n' "$(git rev-parse HEAD)"

      - name: Affected-package race (full race on integration)
        # On pre-prod tip, prefer full race for integration confidence.
        run: bash scripts/ci-full-race.sh

  security:
    name: security
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Record tested commit SHA
        run: |
          set -euo pipefail
          printf 'evidence_tier=merge-sha\n'
          printf 'tested_commit_sha=%s\n' "$(git rev-parse HEAD)"

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}

      - name: Staticcheck
        run: staticcheck ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - name: Govulncheck
        run: govulncheck ./...

      - name: Build loopcoder for audit
        run: |
          set -euo pipefail
          mkdir -p bin
          go build -o bin/loopcoder ./cmd/loopcoder

      - name: Security audit (SAST)
        run: ./bin/loopcoder audit --repo . --layer sast
