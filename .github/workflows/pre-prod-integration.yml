# Bounded merge-sha integration for pre-prod (NOT a full re-run of PR CI).
# PR CI remains authoritative for verify/test/race/security.
# This workflow only runs two distinct checks on the exact integrated SHA:
#   - integration-verify  (policy/YAML/auth fixtures)
#   - integration-canary  (provider-free deterministic canary, hard 5m ceiling)
name: pre-prod-integration

on:
  push:
    branches:
      - pre-prod
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional git ref (defaults to push SHA)"
        required: false
        type: string

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.26.5"

jobs:
  integration-verify:
    name: integration-verify
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Record tested commit SHA
        run: |
          set -euo pipefail
          printf 'evidence_tier=merge-sha\n'
          printf 'integration_job=integration-verify\n'
          printf 'tested_commit_sha=%s\n' "$(git rev-parse HEAD)"

      - name: YAML validity (workflows + delivery)
        run: |
          set -euo pipefail
          ruby -e '
            require "yaml"
            paths = [".delivery.yml"] + Dir.glob([".github/workflows/**/*.yml", ".github/workflows/**/*.yaml"]).select { |path| File.file?(path) }
            paths.sort.each { |path| YAML.load_file(path) }
            puts "yaml_ok files=#{paths.size}"
          '

      - name: Stabilization policy + authorization fixtures
        run: |
          set -euo pipefail
          go test . -count=1 -timeout=2m -run 'TestStabilizationGatePolicy|TestV080WorkflowPolicy'
          go test ./internal/evidence -count=1 -timeout=2m -run 'TestDocsOnly|TestPolicy|TestUnlinked|TestMultiple|TestNonPlanned|TestBodyOnly|TestPlannedWith|TestReady|TestBaseSHA'
          IMPLEMENTATION_AUTH_OFFLINE=1 bash scripts/check-implementation-authorization.sh

  integration-canary:
    name: integration-canary
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Record tested commit SHA
        run: |
          set -euo pipefail
          printf 'evidence_tier=merge-sha\n'
          printf 'integration_job=integration-canary\n'
          printf 'tested_commit_sha=%s\n' "$(git rev-parse HEAD)"

      - name: Provider-free integration canary (hard wall clock 5m)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          START="$(date +%s)"
          # Deterministic, no provider, no network, no full suite.
          go build -o /tmp/loopcoder-canary ./cmd/loopcoder
          /tmp/loopcoder-canary version >/dev/null
          go test ./internal/evidence -count=1 -timeout=90s
          bash scripts/pre-push-sentinel.sh
          END="$(date +%s)"
          ELAPSED="$((END - START))"
          printf 'integration_canary_elapsed_seconds=%s\n' "${ELAPSED}"
          if [ "${ELAPSED}" -gt 300 ]; then
            echo "integration-canary exceeded 300s wall clock" >&2
            exit 1
          fi
